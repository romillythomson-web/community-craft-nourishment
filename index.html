<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map</title>
  <style>
    @font-face {
      font-family: "Limkin BookFlare";
      src: url("fonts/TMT-Limkin-BookFlare.otf") format("opentype");
    }

    /* ============================================================
       COLORS — change these once and the whole page follows
       ============================================================ */
    :root {
      --paper: #fffdf6;      /* page background (same as home.html) */
      --ink: #000b6d;        /* dark blue for the map outline + text */
      --pin: #000b6d;        /* pin color before hovering */
      --pin-hover: #0081a5;  /* pin color while the mouse is over it */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Limkin BookFlare", Georgia, serif;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--pin-hover); }

    .back-link {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      font-family: sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ABOUT link — top left corner. Opens the "about" template below. */
    .about-link {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
      padding: 0;
      background: none;
      border: none;
      color: var(--ink);
      font-family: sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .about-link:hover,
    .about-link:focus-visible { color: var(--pin-hover); }

    /* ============================================================
       TITLE + SUBTITLE — top right corner
       - LOCATION: change `top` / `right` on `.heading` to move both.
       - `left` stops the title running into the Home link; on narrow
        screens the title wraps onto more lines instead.
       ============================================================ */
    .heading {
      position: fixed;
      top: 1.25rem;
      right: 2rem;
      left: 8rem;
      text-align: right;
      z-index: 10;
    }

    .title {
      margin: 0;
      font-family: sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .place {
      margin: 0.6rem 0 0;
      font-family: sans-serif;
      font-size: 1rem;
    }

    /* ============================================================
       THE MAP
       - The outline is drawn from OpenStreetMap data (© OpenStreetMap
         contributors) and lives in the <svg> below.
       - .coast = shoreline + harbor walls (thick lines)
       - .buildings / .roads = the town (thin lines)
       ============================================================ */
    .map-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map {
      width: 100%;
      height: 100%;
    }

    .map .coast     { fill: none; stroke: var(--ink); stroke-width: 3;   stroke-linejoin: round; stroke-linecap: round; }
    .map .piers     { fill: none; stroke: var(--ink); stroke-width: 3;   stroke-linejoin: round; stroke-linecap: round; }
    .map .buildings { fill: none; stroke: var(--ink); stroke-width: 0.7; }
    .map .roads     { fill: none; stroke: var(--ink); stroke-width: 0.5; opacity: 0.35; }

    /* ============================================================
       PINS — the three clickable spots
       - LOCATION: change `transform="translate(x y)"` on each
         <g class="pin"> in the HTML below to move a pin.
       - HOVER: the color swap happens in `.pin:hover`.
       ============================================================ */
    .pin { cursor: pointer; outline: none; }

    .pin circle {
      fill: var(--pin);
      stroke: var(--paper);
      stroke-width: 3;
      transition: fill 0.2s ease, r 0.2s ease;
    }

    .pin .ring {
      fill: none;
      stroke: var(--pin);
      stroke-width: 1.5;
      transition: stroke 0.2s ease;
    }

    .pin text {
      fill: var(--ink);
      font-family: sans-serif;
      font-size: 18px;
      paint-order: stroke;
      stroke: var(--paper);
      stroke-width: 5px;
      transition: fill 0.2s ease;
    }

    .pin:hover circle,
    .pin:focus-visible circle { fill: var(--pin-hover); r: 13; }
    .pin:hover .ring,
    .pin:focus-visible .ring  { stroke: var(--pin-hover); }
    .pin:hover text,
    .pin:focus-visible text   { fill: var(--pin-hover); }

    /* ============================================================
       STORY PAGE — slides in from the right and covers the whole
       page when a pin is clicked. Scroll inside it to read.
       - #panel-content is the reading column; change `max-width`
         to make the column of text + pictures wider or narrower.
       ============================================================ */
    .panel {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--paper);
      padding: 5rem 2rem 4rem;
      transform: translateX(100%);
      transition: transform 0.5s ease;
      z-index: 20;
    }

    #panel-content {
      position: relative;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ============================================================
       WISPY LINE — winds down behind a story and draws itself in
       as you scroll. Add <svg class="wisp"><path/></svg> as the first
       line of any person's <template> to give them one too.
       - stroke-width: thickness (the coast outline is about 3px)
       - The shape is built in the script at the bottom (drawWisp).
       ============================================================ */
    .wisp {
      position: absolute;
      top: 0;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }

    .wisp path {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* keeps the text + videos sitting on top of the line */
    #panel-content > :not(.wisp) {
      position: relative;
      z-index: 1;
    }

    .panel.open { transform: translateX(0); }

    .panel-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: var(--ink);
      font-family: sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .panel-close:hover { color: var(--pin-hover); }

    /* The workplace line under each person's name */
    .panel .job {
      margin: 0 0 2rem;
      font-family: sans-serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .panel h2 {
      margin: 0 0 0.4rem;
      font-family: sans-serif;
      font-size: 2.2rem;
    }

    /* Videos + pictures between the paragraphs.
       - max-height stops tall phone clips taking up several screens;
         raise it (e.g. 90vh) to make them bigger.
       - They sit centered in the reading column. */
    .panel video,
    .panel img {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      margin: 2.5rem auto;
    }

    /* Clips side by side: wrap the <video> tags in <div class="pair">.
       - They all line up at the same height.
       - Tall phone clips work as-is. For a WIDE clip, add
         style="--ar: 1.778" to its <video> tag so it gets more room.
       - Add the class "wide" (<div class="pair wide">) to let a row of
         3–4 clips stretch wider than the text column. */
    .panel .pair {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      margin: 2.5rem 0;
    }

    .panel .pair video,
    .panel .pair img {
      margin: 0;
      flex: var(--ar, 0.5625) 1 0;
      width: 0;
      min-width: 0;
      height: auto;
      max-height: none;
    }

    .panel .pair.wide {
      width: min(1200px, 100vw - 4rem);
      margin-left: 50%;
      transform: translateX(-50%);
    }

    /* The interviewer's questions */
    .panel .q {
      margin: 2.5rem 0 1rem;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.5;
      color: var(--ink);
    }

    .panel p {
      font-family: Helvetica, Arial, sans-serif;  /* same font as the questions */
      margin: 0 0 1.2em;
      line-height: 1.6;
      font-size: 1.15rem;
      color: #1f1f1f;
    }

    /* Links inside the story text — underlined so they read as links */
    .panel p a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    .panel p a:hover { color: var(--pin-hover); }

    /* The stories live in hidden <template> tags; this keeps them out of sight */
    .story { display: none; }

    @media (max-width: 700px) {
      .heading { right: 1rem; left: 5rem; }
      .title { font-size: 1.6rem; }
      .panel { padding: 4rem 1rem 2rem; }
    }
  </style>
</head>

  <template id="rikke">
    <svg class="wisp" aria-hidden="true"><path/></svg>
    <h2>Rikke</h2>
    <p class="job">Birkemosegaard</p>

    <img src="images/rikke/rikkestill.jpg" alt="Rikke at Birkemosegaard">

    <p class="q">Could you introduce yourself and talk about what Birkemosegaard is?</p>
    <p>My name is Rikke. I work in communication for the farm. I have a background in design and communication and am really drawn to this organic farming, and working to get better produce out to the customers and get people to be more aware of what good produce should taste like.</p>
    <p>The mission for us is to grow some of the best greens that you can. It’s also our mission to get it out to customers broadly. We try to not be too expensive because there's a lot of small farms, they do really great work and they grow great produce, but they're also very small scale, which means that the produce gets quite expensive.</p>

    <video src="videos/rikke/morefieldfarm_include.mp4" autoplay muted loop playsinline></video>

    <p>Of course we also cater for a certain group of people who want to spend money on, on food, I think that we can have a broader range, whereas some of the, the smaller farms, maybe it's very like a limited, group of people who go to the green market and, you know, they pay quite a lot of money for small things and it gets a little elitist.</p>
    <p>We really try here to get organic produce out to the public. Maybe it's not always the top products, but still people get a sense of how things taste when they don't buy it in the supermarket. In that way we hope we can push it a little bit, so they make maybe a little better choice next time. We also have this restaurant here where we try to show what you can do with good produce. Then we have the farm shop, which is also our way of making our produce available.</p>

    <video src="videos/rikke/outsidefarm.mp4" autoplay muted loop playsinline></video>

    <p class="q">How long has this farm been here?</p>
    <p>It's a fourth generation farm. The farm went biodynamic in 1970, maybe a little bit before. Then for many years they produced, like with the Demeter certificate and then I think about five years ago, the owner felt that it was too, too much trouble to get the certificate. We just agreed that he should grow biodynamically but without doing that extra administrative work. There are so many different rules that make it very time consuming to get that certificate.</p>

    <p class="q">Can you talk a little bit about what biodynamic farming is?</p>
    <p>To say it shortly, it reflects that we are all connected to the universe, to the planets and the moon and the sun, and we have to grow and harvest in respect for the whole circle. It's also about the energy you put into the fields. The rules are more strict than when you grow organic. There's more consideration to the animals. Of course you don't use any kind of chemicals or anything. It's a very old kind of philosophy about producing. Maybe it's not totally up to date with how farms are working today. There are very different ways today of producing and biodynamic is one of them.</p>

    <video src="videos/rikke/lettuces.mp4" autoplay muted loop playsinline></video>

    <p>I think up here now we can also do it a little bit eclectic. Let's see what works, and that's more the way we go now. But of course we don't use any kinds of chemicals or and we do as much as we can to let the greens grow at the pace they need.</p>
    <p>We don't cover up anything. We don't cover the potatoes so they can grow faster. We have a small field with strawberries, but the strawberries we grow they peak for two weeks and then that's it. Whereas when you go into the supermarket today, you get a lot of produce that has a very long life, but they don't have that intense taste.</p>

    <p class="q">When I was talking to Matthew, he said that whenever he was in Copenhagen and thought like, this is the best carrot I've ever had, or this is the best beet I've ever had, it was always from this farm.</p>
    <p>There is something about the soil out there, maybe that just does something about the taste. People think that we have the world's best potatoes here. They're really, really good and people come far just to get our potatoes.</p>
    <p>So I don't know exactly what it is, but it could also just be that the way we have been and that the family has been working with the soil for decades, and it just gets more potent. Of course we are very proud of what we have here. That's not something that you can get when you have a conventional farm or even an organic farm grows organic, but at a very low level.</p>

    <div class="pair">
      <video src="videos/rikke/veg.mp4" autoplay muted loop playsinline></video>
      <video src="videos/rikke/cabbage.mp4" autoplay muted loop playsinline></video>
      <video src="videos/rikke/onions.mp4" autoplay muted loop playsinline></video>
    </div>

    <p>A lot of people actually also tell me, like, I also feel different. It feels like there's something more than just the taste. I think that's something that we believe a lot in here, like the energy you put in the work, either even if it's like up here working in the kitchen or if it's how you treat your customers and in the end how you treat the cows, how you treat the the greens, that there is something about that feeling you get when you consume it.</p>
    <p>We also have free range cattle and we make sure that they eat what they're supposed to eat. The feed is just the grass and they just run around in the fields and they take care of themselves. We slaughter the cows and we eat the beef, and it has a really good taste. We feel that they've had a good life and it's very important for the fields. The stomach produces different kinds of bacteria that end up in the fields, and that's really the best nutrition for growing greens and fruit. Also, the hoofs, the way they move the soil around is very important for turning the soil. We don't come with a machine and dig deep. But these cows, they just turn it a little bit. Actually when the cows work in the field like that, it actually takes carbon dioxide from the air and gets it Into the ground, into the soil where it is useful.</p>

    <video src="videos/rikke/machinery.mp4" autoplay muted loop playsinline></video>

    <p>There's all this talk about cows, about burping CO2, and of course they do. But actually, when cows just eat what they're supposed to eat they don't burp that much. I think we all know that as human beings as well, how we eat is also affecting our digestion.</p>

    <p class="q">How do you view the culture of food in a smaller town like this vs Copenhagen?</p>
    <p>As in all other areas, it's in the big cities where the consumers are. We deliver our produce into Copenhagen four times a week. The people who come here in the farm shop are mostly people who have a summer house in the area. I don't think that the locals care that much.</p>

    <video src="videos/rikke/farmshop.mp4" autoplay muted loop playsinline></video>

    <p>We have different restaurants by the harbor in front, and it's very obvious to see who attends which restaurants. I think that this whole organic community is still very much for people in the bigger cities who prioritize that. I don't necessarily think that just because you have a farm up here that the locals really care.</p>
    <p>The farming is outside of the bigger cities, but it's all about getting the produce into the city. We couldn't survive if we didn't have the restaurants and customers in Copenhagen, that's for sure.</p>

    <video src="videos/rikke/orchard.mp4" autoplay muted loop playsinline></video>

    <p class="q">Is it part of the farm's work of trying to expand your reach in an educational way?</p>
    <p>I think it's more like a bigger structural challenge. On a society level, we use so many chemicals that we are destroying the environment and we are allowing that to happen. As long as the prices are cheaper, then most people will want that. It's a lot about, of course, you know, starting in the schools – like today, we have a kindergarten up here and we have schools coming up and we can tell them about what we do.</p>
    <p>But I think it's more like if this is something we want to change, like in a massive respect, then it's something that needs to be challenged in a more structural way.</p>
    <p>We are in Denmark where we have a high percent of organic consumers compared to a lot of other countries, but I still think the percentage is quite small of produce being bought organic. There's still a lot of conventional food and junk food and processed foods. I think that's not a task that the farm can tackle, that's a big one.</p>
    <p>We can just do what we do. We do what we believe in. We can try to make it attractive to get organic produce and show people this is how it looks, it tastes, it feels like, and we try to make it affordable. We know that it's more expensive than going to the average grocery store, but we can do as much as we can.</p>
    <p>My dream is of course that at some point we are all just growing organic. I think the challenge is also to make people aware of how hard work it is to run a farm like this, and why the prices are as they are, and we are actually really cheap for what we do.</p>
    <p>We have a lot of challenges now because of the climate changes. We have bugs that are destroying our crops at a pace that we've never seen before. There are many crops that we can't grow anymore because we obviously don't use any chemicals, so they are just eating all the kale and the cabbage and all those small things that we just can't grow anymore.</p>
    <p>It's not just us, but it's all the organic farmers that have these problems. Of course, that's time consuming. And that's expensive, and you see your crops just disappearing. We also have problems, of course, with drought, with water.</p>
    <p>We have also seen many more bankruptcies, and the challenges of who is gonna take over, like the young farmers who still find this attractive. It's hard work and you don't get a lot of money out of it. So I really just also hope for the consumers that they really become more aware that this is a shared responsibility. If we want to keep having these kinds of products available to us, we all need to take some kind of responsibility in keeping that production.</p>
    <p>I don't know how to make that happen. It's one of the most important issues when we talk about all these things today, because, you know, we are very skilled in growing. We have a lot of new technology. We have a lot of knowledge. But it's also on the consumer's shoulders to pay the price. When you go to a restaurant, there is a reason why a menu has the price it has. Sometimes I see prices that are so cheap that I think people should think, How do you think that cow has been treated when you can get a, you know, a steak for that price? How do you think the fries are made? I just wish people would respect the farmers by paying the price that it actually costs to grow and maybe spend less money on other stuff.</p>
  </template>

    <p class="q">Can you introduce yourself?</p>
    <p>My name is Matthew Parker. I am originally from the southeast of England, and I now live in Sjaellands Odde, in Denmark. I've been living here for around six years, and I run a small business in a small seaside town in the middle of nowhere.</p>

    <video src="videos/matthew/mattsshpp.mp4" autoplay muted loop playsinline></video>

    <p class="q">How did you decide to go from the restaurant world to opening your shop and what was that transition like?</p>
    <p>I didn't move to this area with the intention of opening a shop. It was actually something that came around after I'd lived here for maybe a year, maybe 18 months. I think that transitioning out of restaurant work was listening to my own needs more than I probably did before. Working in hospitality in the service industry is really, really difficult. It's a lot of effort involved. There's a lot of work in it. There's not a huge amount of reward, and you're also working a lot of the time on behalf of others. For me to come up here and spend more time in an area like this, it was mainly to connect with produce itself.</p>
    <p>Like you work in restaurants, you go and buy the most incredible vegetables and meats and really interesting local produce from Danish producers, organic producers, and foragers, but you are stuck in a box of stainless steel, trying to connect with where the produce is coming from. At the end of the day, that's a really, really difficult process when you don't have a lot of stimulation around you. You're relying on just stimulating yourself through, working with the produce in a quite sterile environment.</p>
    <p>When I worked in Copenhagen at a restaurant, I kept tasting vegetables and fruits and herbs that were just the most flavorsome I've ever had. Every time the answer was when I asked, where is it from? It was always the same farm.</p>
    <p>The farm is Birkemosegaard, which is up here and it made me just think after a few periods of months when I was working in this restaurant and I kept tasting all this great produce and the answer kept being the same, I really need to go to this place and see what it's like and spend more time there. The most inspiring part of being there is seeing what people can do and the amount of work that it takes to get good quality food on people's plates.</p>

    <div class="pair">
      <video src="videos/matthew/shop_wine.mp4" autoplay muted loop playsinline></video>
      <video src="videos/matthew/mattshop2.mp4" autoplay muted loop playsinline></video>
    </div>

    <p class="q">Has your view on food production and cooking changed since being here and being in the shop?</p>
    <p>My opinion on cooking I would say has definitely changed. I worked as a chef for 10 years. I've worked in the UK and London, and also in Denmark and Copenhagen as well as closer to where I'm living now, more rurally.</p>
    <p>I think moving here has taught me about cooking and food is more about how much I enjoy doing it for my loved ones instead of in a commercial environment. I miss the feeling of being tired and working busy services and having a big team that has made something really special happen.</p>
    <p>But I don't feel like cooking for people for money is the reason I want to be cooking in the first place. I think that it's a way to share experiences with people. I find it really hard to put value on what I do in terms of financial value, but I find value in many, many other places. I think the word value is so associated with money and wealth and I just don't have that feeling whatsoever.</p>
    <p>I think value comes from community and connection and supporting others with the resources that you have and being resourceful in an environment where you can have an impact and make things happen. People are able to see directly how it can affect them in a positive way, like both in an enterprising way, having a business in a small area and supporting other businesses, but also supporting people's family units and supporting a community.</p>

    <p class="q">Can you talk a little bit about the community here and like your work with local producers and how that started?</p>
    <p>When I originally moved up here, it was to take a job working at the Birkemosegaard in their summer seasonal restaurant. so being able to go and work directly on the farm that I was inspired by working in restaurants in Copenhagen and knowing that it was a farm based restaurant where they want.</p>
    <p>You want to use as much produce as possible from their own farm, not just for financial purposes, but for the ethics and the integrity of knowing what they're doing and knowing how much work goes into it and wanting to showcase it.</p>
    <p>To be up here and, and to see the fields that your vegetables come from, to see the cows in the field where you know that the meat is coming from, to have a personal connection to the people themselves and see how hard they work, it inspires you to do what you can with that produce and also it enables you to think about what is wasted out of that as well.</p>
    <p>Within my practice of what I do, like I'm not a chef as much as I used to be anymore. I'm not as interested in running a restaurant as I used to be.</p>
    <p>I'm more interested in upcycling and recycling and repurposing second class produce from local farms and forming closed circular economies and symbiotic relationships that last and that are built on trust and not built on financial exchange to help one another use up waste products.</p>

    <div class="pair">
      <video src="videos/matthew/shop_miso.mp4" autoplay muted loop playsinline></video>
      <video src="videos/matthew/mattshop_6900.mp4" autoplay muted loop playsinline></video>
    </div>

    <p>That's where so much of the enthusiasm for what I do comes from, identifying these things and then finding creativity within that field. So reaching out and connecting with food producers, whether it be the local bakery, the local wine maker, the cafe that has a lot of coffee grounds left over.</p>
    <p>I believe that limiting the possibilities through just focusing on what produce is around you is actually way more of a creative process than having the world at your fingertips and ordering whatever you want and putting it on a food menu to be able to just show off the flavor of an 8-year-old dairy cow or beautiful caviar from sturgeon. Anyone can make that taste good because it already tastes really good. It's much harder to find things that are being discarded and actually make them taste like they are something that's not just interesting, but also to showcase how much flavor they still have in them as well.</p>
    <p>I think that there's a lot of lazy chefs out there. I think there's a lot of people who work in the industry that only want to work with prime fillets. It's like a status thing. There's a luxury side of what they wanna be able to work with and put on, put on their menus. I don't think there's too many people that are able to do what I do, and actually identify that there's a really serious problem with food systems.</p>

    <video src="videos/matthew/mattshop_6902.mp4" autoplay muted loop playsinline></video>

    <p>It's maybe a very personal project, and I don't get a lot of support for it, but I'm also not really doing it for anyone else in a way. I think it's a compulsion. I feel very compelled to do what I'm doing. Sometimes I wish I didn't feel this way.</p>

  <template id="peter">
    <svg class="wisp" aria-hidden="true"><path/></svg>
    <h2>Peter</h2>
    <p class="job">Vaerftet Paa Odden</p>

    <p class="q">Can you introduce yourself?</p>
    <p>My name is Peter. I run a shipyard here in Sjaellands Odde. We have a slipway where we can pull up boats that are up to 60 tons, and we do restoration and maintenance on our own fishing fleet that we have here as well as boats that come from other places in Denmark.</p>

    <video src="videos/peter/repair_tools.mp4" autoplay muted loop playsinline></video>

    <p class="q">How did you get into boat restoration?</p>
    <p>Through the personal contact with my previous boss, we met and had a connection. And it was almost unspoken that I should be his apprentice and take over the shipyard after him.</p>
    <p>He was rather old. He was 69 when I started working with him, and he thought that after him it would be the end. He would turn back the keys to the municipality and they'd bulldoze the place and put a parking lot here. Basically, it would be the end of this business at this point already; there was a big decline in the fishing industry.</p>
    <p>Maintenance shipyards like this used to be in every single harbor in Denmark. There's some problem, there's some leaks, there's a hose that broke on deck, and these shipyards perform really multi-talented, quick fixes that get the fishermen back out on the water real fast and cheap.</p>
    <p>But as the fishing industry declined, it became hard for these places to have enough work to sustain themselves. And with the age of the people who had these places, they end up closing, and when they close they never really start again. If a shipyard is abandoned for two years, it usually means that's the end. The knowledge, the skills, the attraction of the place declines, and in the end, the harbor is transformed into something else.</p>
    <p>We have taken on this legacy, and we continue to do this maintenance based work, but we've also expanded beyond what the scope of this place was by branding ourselves on doing larger restorations. Really full scale restorations.</p>
    <p>There's a change in perspective, which really went from a few years ago, like, ‘Oh, it's, it's the end of this wooden boat industry’, but to realize, actually this doesn't have to be the end. Let's keep going.</p>

    <video src="videos/peterlooking.mp4" autoplay muted loop playsinline></video>

    <p class="q">What do you think made that change?</p>
    <p>I think there are several reasons for it. You can say it's for financial incentives and cultural heritage reasons. The truth is that for many years, it was said that wooden boats were quite expensive in maintenance, and it would be better to have fiberglass or steel boats. And yet, when you really look at it, the old steel boats have not been maintained well, and they end up being in much worse states and require a lot more investments to get in back good shape.</p>
    <p>A fully restored wooden boat, it's gonna last you 30 years almost maintenance free. Even a hundred years, the boat can last – it can last forever if you take care of it, really. So there's a financial side to it.</p>
    <p>Though there’s also the identity associated with it, and a certain kind of stubbornness and hardiness and fascination, I think. The identity aspect is not only true for the fishermen. We have working boats, but we also have previous working boats that have been turned into leisure crafts, or boats being used for sailing with kids as part of association, as part of schools and other personal fulfillments. Whether you are a fisherman or you are a teacher who wants this, it's all caught up in personal fulfillment and fulfilling an understanding of who you are and of who we are as a community.</p>
    <p>We touch the sphere of something that is cultural or spiritual. We have the tools to take care of the physical thing that allows this to happen, and to give people these experiences on the ocean. We are the magicians or the fixers who make this happen.</p>
    <p>Our work goes beyond fixing the boat for the boat owner. That's very clear especially in the summertime, when a thousand people come into town everyday, like from guest boats or summerhouse guests or people driving by. They come and they're walking by here and they say, ‘Oh this smells like my grandfather's workshop’. There’s a fascination, because the maritime culture is part of the entire Danish self identity.</p>
    <p>It's something that every family in Denmark has some connection to: some family member who left as a sailor, or there's some connection to the ocean one way or the other. And this bond is anchored in the traditional craft. Even if you don't have a boat, you never go to the ocean, you know absolutely nothing about it, you see what we do and you feel, ‘This is also mine’.</p>
    <p>So, we are restoring a boat for one owner, but actually it's like this belongs to everyone – it's our shared heritage. We inherited it, and we continue it.</p>

    <video src="videos/calmharbor.mp4" autoplay muted loop playsinline></video>

    <p class="q">Do they have different types of boats at this point in 2025, or are the boats pretty similar?</p>
    <p>Hmm, no. There are many different kinds of boats. Some, that last, were new builds from the late sixties, early seventies. Some boats are much older and well taken care of. Some have been highly neglected. And this is like we talked about earlier, there are very different styles of attitude. Whether it's small patch ups or a big go.</p>
    <p>There is a particular modification that we see in the boat types where they used to have a round aft and troll from the side of the boat. At some point the tendency became to move it to the aft and have maybe two or bigger trolls to have more space. So, this created an interesting transition where you're going back and essentially building a transom; you cut up the boat and you prolong it, and you give it a flat aft.</p>
    <p>This design was normal in the 1800s, but then disappeared entirely. Then it came back and it's interesting that this is actually the demand now. Yet when you are in the environment of celebrating these traditional crafts, this change is actually sometimes frowned upon because it's like, oh, this, doesn't look like the inspirational value of a traditional boat because it's seen as a modern change, even though it was common in the 1800s.</p>
    <p>There's an interesting question of when is a boat worthy of preservation? When does it go from being like, okay, now we actually think this is how it was? We consider them worthy of preservation most of the time because they were working boats representing a particular era, a particular set of possibilities that these boats could do in that area. When will these boats become that? Is it not worthy of preservation if they are using them now? If we have to take them out of the fishing industry and then transform them to what they look like in the early 1900s when the boat never had looked like that to begin with, what is the purpose?</p>
    <p>Though I suppose there is a purpose, and its inspirational value and its cultural heritage. We see that boat and perhaps now think, oh, now I'm feeling very inspired. Because you see something that looks like a boat would look like in the 1800s, when it's actually a boat from the 1900s – much later, that has nothing to do with this style. Yet it's true that it has an effect that is undeniable. But still, what is it that does that? Why is it possible to get money from foundations for some kinds of boat, but if you're an active fisherman with a transom, maybe it's not so interesting for them to restore it. It's a discussion.</p>

    <p class="q">Do you ever like push back? If someone asks you to modify a boat to something perhaps not as authentic, is that a conversation you try to have with your customers at all?</p>
    <p>Yes. I always have conversations to try to understand what it is that the customer wants. And normally what the customers want will change during the course of a job. This requires very clear communication.</p>
    <p>For us, like I explained earlier, we hold the skills to unlock something that gives people great experiences and personal fulfillment, and we don't need to say, this is right, this is not right. We can have our own ideas about it and people can have their own ideas about it. They're all right. They're all maintaining their idea of cultural heritage, and our job is to unlock that.</p>

    <div class="pair">
      <video src="videos/peter/boat_repair2.mp4" autoplay muted loop playsinline></video>
      <video src="videos/peter/harborrepair.mp4" autoplay muted loop playsinline></video>
    </div>

    <p class="q">What is your favorite part of this job?</p>
    <p>It's the people. It’s the social impact, and it's the space to be hardworking and having a space where the job requires physical capacity. That is my personal fulfillment, and it is beautiful to see how this set of hardships or difficulties empower people. So it's a mixture of how I feel empowered, and how I see people being empowered. This is the most beautiful and makes me cry.</p>

    <p class="q">It sounds like there's a resurgence of appreciation of this craft and the fishing history here. Is that accurate, would you say?</p>
    <p>Yes.</p>

    <p class="q">Do you have any sense of why that might be?</p>
    <p>There are many reasons. There's definitely a question of how you connect with the value you attribute to the materials around you. Modernization has provided us with welfare and the possibility to acquire a lot of material goods and values, but they are also disconnecting us from certain aspects of our skills and independence in our communities.</p>
    <p>So there's a craving for this self-reliability, that you can fix your own things like some breakdown. Today, we are getting cheaper solutions and easier solutions, and by that, losing some of the connection with our materials around us. The traditional trades represent a direct anchorage and chain to this self reliability that we hunger for, that we need to be empowered as a community.</p>
    <p>It's something about tradition that gives you the sense of attachment, fulfillment, and belonging actually.</p>

    <p class="q">That's really beautiful. Is there anything else you wanna share about your work or your life?</p>
    <p>I would like to emphasize this aspect of how certain tough environments and tough lines of work can feel attractive because of the empowerment that you build up through it. It's the saying that when the going gets tough, the tough get going. It does something magical to people, and I like to promote that.</p>
  </template>

    // ---------- Wispy line ----------
    // Where the line swings to on each pass across the page

    const WISP_SWINGS = [0.88, 0.1, 0.8, 0.18, 0.93, 0.06, 0.75, 0.22, 0.9, 0.12];

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      svg.setAttribute('width', W);
      svg.setAttribute('height', H);
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.style.left = left + 'px';

      const passes = Math.max(3, Math.round(H / WISP_PASS_HEIGHT));
      const step = H / passes;
      // Starts just past the left edge of the screen (so there's no visible
      // tip) and heads in sideways before winding down the page.
      let x = -4, y = 0;
      let d = `M ${x} ${y}`;
      for (let i = 0; i < passes; i++) {
        const nx = W * WISP_SWINGS[i % WISP_SWINGS.length];
        const ny = y + step;
        const c1 = i === 0 ? `${W * 0.35} ${y}` : `${x} ${y + step * 0.55}`;
        d += ` C ${c1}, ${nx} ${ny - step * 0.55}, ${nx} ${ny}`;
        x = nx; y = ny;
      }
      path.setAttribute('d', d);

      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.dataset.len = len;
      updateWisp();
    }

    // Reveals more of the line the further down you scroll
    function updateWisp() {
      const path = content.querySelector('.wisp path');
      if (!path) return;
      const len = +path.dataset.len || 0;
      if (reduceMotion) { path.style.strokeDashoffset = 0; return; }
      // The line stays just ahead of the reader: drawn down to ~60% of the
      // screen, and fully drawn once you reach the bottom.
      const max = panel.scrollHeight - panel.clientHeight;
      const atBottom = panel.scrollTop >= max - 2;
      const progress = atBottom ? 1 : (panel.scrollTop + panel.clientHeight * 0.6) / panel.scrollHeight;
      path.style.strokeDashoffset = len * (1 - Math.min(1, progress));
    }

    panel.addEventListener('scroll', updateWisp, { passive: true });
    // Videos load in and change the page height, so rebuild when that happens
    new ResizeObserver(drawWisp).observe(content);
    window.addEventListener('resize', drawWisp);

    // Close the panel and stop any videos playing inside it
    function closeStory() {
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      content.querySelectorAll('video').forEach(v => v.pause());
    }

    document.querySelectorAll('.pin').forEach(pin => {
      pin.addEventListener('click', () => openStory(pin.dataset.person));
      pin.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStory(pin.dataset.person); }
      });
    });

    document.getElementById('about-link').addEventListener('click', () => openStory('about'));
    document.getElementById('panel-close').addEventListener('click', closeStory);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStory(); });
  </script>
</body>
</html>
